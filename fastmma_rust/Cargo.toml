[package]
name = "fastmma_rust"
version = "0.0.1"
edition = "2021"

[lib]
name = "fastmma_rust"
# cdylib so maturin can build a Python extension module
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
ndarray = "0.16"
libm = "0.2"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
